<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- White Background -->
  <rect width="100" height="100" fill="#FFFFFF" />
  <!-- Fridge Body -->
  <rect x="25" y="15" width="50" height="70" rx="8" fill="#379271" />
  <!-- Fridge Split Line -->
  <line x1="25" y1="45" x2="75" y2="45" stroke="#FFFFFF" stroke-width="3" />
  <!-- Top Handle -->
  <rect x="30" y="25" width="4" height="12" rx="2" fill="#FFFFFF" />
  <!-- Bottom Handle -->
  <rect x="30" y="55" width="4" height="20" rx="2" fill="#FFFFFF" />
</svg>